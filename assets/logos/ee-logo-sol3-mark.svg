<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-labelledby="title desc">
  <title id="title">Earth Exports Sol-3 mark</title>
  <desc id="desc">Facing teal E and mirrored E with sun, Mercury, Venus, and Earth stacked between them.</desc>
  <defs>
    <clipPath id="earthClip">
      <circle cx="100" cy="92" r="14"/>
    </clipPath>
  </defs>

  <!-- Left E (bars open toward center / right) -->
  <g fill="#00A896">
    <rect x="18" y="18" width="14" height="84" rx="2"/>
    <rect x="18" y="18" width="52" height="14" rx="2"/>
    <rect x="18" y="53" width="40" height="14" rx="2"/>
    <rect x="18" y="88" width="52" height="14" rx="2"/>
  </g>

  <!-- Right mirrored E -->
  <g fill="#00A896">
    <rect x="168" y="18" width="14" height="84" rx="2"/>
    <rect x="130" y="18" width="52" height="14" rx="2"/>
    <rect x="142" y="53" width="40" height="14" rx="2"/>
    <rect x="130" y="88" width="52" height="14" rx="2"/>
  </g>

  <!-- Sol stack (center), pointing down -->
  <!-- Sun -->
  <g transform="translate(100 28)">
    <circle r="7" fill="#F77F00"/>
    <!-- rays -->
    <g stroke="#F77F00" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-11" x2="0" y2="-14"/>
      <line x1="0" y1="11" x2="0" y2="14"/>
      <line x1="-11" y1="0" x2="-14" y2="0"/>
      <line x1="11" y1="0" x2="14" y2="0"/>
      <line x1="-7.8" y1="-7.8" x2="-10" y2="-10"/>
      <line x1="7.8" y1="-7.8" x2="10" y2="-10"/>
      <line x1="-7.8" y1="7.8" x2="-10" y2="10"/>
      <line x1="7.8" y1="7.8" x2="10" y2="10"/>
    </g>
  </g>

  <!-- Mercury -->
  <circle cx="100" cy="52" r="4.5" fill="#A89B8C"/>
  <!-- Venus -->
  <circle cx="100" cy="66" r="5.5" fill="#C4B59A"/>

  <!-- Earth with orange highlight ring (not Saturn ring) -->
  <circle cx="100" cy="92" r="16" fill="none" stroke="#F77F00" stroke-width="2.5" opacity="0.95"/>
  <circle cx="100" cy="92" r="14" fill="#028090"/>
  <g clip-path="url(#earthClip)">
    <!-- simple continent blobs -->
    <path fill="#00A896" d="M88 86c4-3 8-2 10 1 3 2 2 6-1 8-4 2-8 1-10-2-2-3-1-5 1-7z"/>
    <path fill="#00A896" d="M102 88c5-1 9 2 8 6-1 4-5 5-8 3-4-2-4-6 0-9z"/>
    <path fill="#00A896" d="M95 98c3 1 6 3 5 6-2 2-6 1-8-1-1-3 0-5 3-5z"/>
  </g>
</svg>
